<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Space Aurora Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0e172e"/>
      <stop offset="60%" stop-color="#050714"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>

    <!-- Northern Lights Emerald to Cyan to Purple Gradient -->
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="75%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="glowRing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Inner Shield Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle for Apple & Android Adaptive Icons -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Glass Border with Aurora Stroke -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#auroraGrad)" stroke-width="6" stroke-opacity="0.6"/>

  <!-- Glowing Ambient Halo -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glowRing)" stroke-width="2" stroke-dasharray="16 12" stroke-opacity="0.4" />

  <!-- Glowing Core Aura -->
  <circle cx="256" cy="256" r="120" fill="url(#auroraGrad)" opacity="0.18" filter="url(#glow)" />

  <!-- Outer Dynamic Orbit Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#auroraGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="320 180" />

  <!-- Central Stylized N & Compass Star -->
  <g transform="translate(256, 256)">
    <!-- Dynamic Play & Compass Shape -->
    <path d="M-60 -90 L70 0 L-60 90 Z" fill="url(#auroraGrad)" filter="url(#glow)"/>
    <!-- Central Nova Core Star -->
    <circle cx="85" cy="-80" r="22" fill="#34d399" filter="url(#glow)"/>
    <circle cx="85" cy="-80" r="12" fill="#ffffff"/>
  </g>
</svg>
