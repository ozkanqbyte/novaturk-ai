name: ai_calculator_pro
description: "AiPremium Hesap Makinesi - Yapay zeka destekli, modern ve güçlü hesap makinesi. 40+ özel hesaplayıcı, sesli komut, OCR, el yazısı tanıma ve daha fazlası!"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  
  # Camera & Image Processing (Mobile/Desktop only - not web)
  camera: ^0.10.6
  image_picker: ^1.0.7
  google_mlkit_text_recognition: ^0.13.0
  google_mlkit_digital_ink_recognition: ^0.12.0
  
  # Voice & Speech (Local AI - Mobile/Desktop only)
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.1
  
  # TensorFlow Lite (On-device ML - Mobile/Desktop only)
  tflite_flutter: ^0.10.4
  
  # NEW: Web-compatible packages
  shimmer: ^3.0.0
  animated_text_kit: ^4.2.2
  vibration: ^2.0.0
  
  # Local NLP & Text Processing
  string_similarity: ^2.0.0
  
  # HTTP & API
  http: ^1.2.1
  dio: ^5.4.3+1
  
  # State Management
  provider: ^6.1.2
  get: ^4.6.6
  
  # Storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Math & Graphing
  math_expressions: ^2.5.0
  fl_chart: ^0.68.0
  function_tree: ^0.9.0
  
  # Social & Sharing
  share_plus: ^12.0.0
  url_launcher: ^6.3.2
  
  # Firebase (Analytics + Crashlytics)
  firebase_core: ^3.8.1
  firebase_analytics: ^11.3.4
  firebase_crashlytics: ^4.1.4
  
  # Ads (AdMob)
  google_mobile_ads: ^5.2.0
  
  # In-App Purchases (IAP)
  in_app_purchase: ^3.2.1
  in_app_purchase_android: ^0.4.0+4
  in_app_purchase_storekit: ^0.3.19+1
  
  # 🛡️ SECURITY & ANTI-CRACK SYSTEMS (FREE)
  safe_device: ^1.1.5  # Comprehensive device security checks (Root/Jailbreak detection)
  app_tracking_transparency: ^2.0.5  # iOS tracking transparency
  device_info_plus: ^11.2.0  # Device information for verification
  package_info_plus: ^8.1.2  # App package verification
  flutter_secure_storage: ^9.2.2  # Secure credential storage
  encrypt: ^5.0.3  # Data encryption
  crypto: ^3.0.6  # Cryptographic functions
  
  # Utils
  intl: ^0.20.2
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
    - assets/sounds/
    - assets/models/  # TFLite AI models
    


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
